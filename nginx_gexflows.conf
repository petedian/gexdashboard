# Reverse proxy sitting between the Cloudflare tunnel and Streamlit, purely
# so real request logging exists. Cloudflare passes the actual visitor IP in
# the CF-Connecting-IP header on every request -- cloudflared's own log never
# shows it, only Cloudflare's edge node IP, so there's no way to see real
# traffic/visitor patterns without something like this in the path.
log_format gexflows_access '$http_cf_connecting_ip - [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" rt=$request_time';

server {
    listen 127.0.0.1:8080;
    server_name dashboard.gexflows.com;

    access_log /home/finance/Tastytrade-API-GEX-Dashboard/nginx_access.log gexflows_access;
    error_log /home/finance/Tastytrade-API-GEX-Dashboard/nginx_error.log;

    location / {
        proxy_pass http://127.0.0.1:8501;
        # Streamlit is WebSocket-based (live reruns) -- these headers and the
        # long read timeout are required, not optional, or the app breaks.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_read_timeout 86400;
    }
}
